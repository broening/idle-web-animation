name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: engine is a pure function of time
        run: node tools/test-determinism.mjs
      - name: page and contact sheet agree
        run: node tools/test-agreement.mjs
      - name: moods do what the schema says
        run: node tools/test-states.mjs
      - name: OBS scene-name matching
        run: node tools/test-addons.mjs
      - name: nothing newer than Chromium 103
        run: python tools/check-compat.py
